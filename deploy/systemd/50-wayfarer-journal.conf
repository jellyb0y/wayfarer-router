# Cap the runtime (RAM) journal.
#
# This is the log budget: up to 200 MB of structured logs live in RAM, and the journal for
# the current boot is lost on power failure — which is why significant events are also
# written to a small persistent ring in the database, and why both are readable through
# the API.
#
# Deliberately not set here: Storage=. Changing where logs are stored is a policy for a
# device Wayfarer owns, and this file may be installed on a machine running other
# software whose logs are not ours to redirect. RuntimeMaxUse only bounds the size of a
# buffer that is already in RAM.
[Journal]
RuntimeMaxUse=200M
